name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: "offline checks (python ${{ matrix.python }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests, case checks, risk scoring (from the committed cache)
        run: python verify.py
      - name: Reports must match the committed ones
        run: git diff --exit-code -- reports/
